name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */4 * *'  # a cada 4 dias ao meio-dia UTC
  workflow_dispatch:          # permite rodar manualmente também

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -f https://api-stock-gestor.vercel.app/api/health || echo "Ping failed"