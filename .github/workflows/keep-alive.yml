name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *'   # todo dia, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive
        run: |
          curl -sS -f --retry 3 --retry-delay 10 --max-time 60 \
            "https://api-stock-gestor.vercel.app/api/keepalive" \
            -H "authorization: Bearer ${{ secrets.CRON_SECRET }}"